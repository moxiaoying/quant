server:
  port: 8088

market:
  # 首页指数预览使用新浪 hq.sinajs.cn HTTP 行情适配器。
  # 如需离线开发可改回 mock。
  provider: sina
  realtime:
    refresh-ms: 5000

trade:
  mode: readonly

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/stock_master?useSSL=false&characterEncoding=utf-8&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  cache:
    type: caffeine

stock:
  data:
    sync:
      concurrency: 2

emSecSecurityServerUrl: http://127.0.0.1:18888/api/verifyUserInfo?

ocr:
  service: chaojiyingOcrService
  third:
    aliyun:
      appcode:
    chaojiying:
      user:
      pass:
      softid: 000000

logging:
  file:
    name: ./logs/stock-service.log
  logback:
    rollingpolicy:
      max-history: 30
  level:
    root: info
    org.springfromework.web: info
    org.springframework.jdbc: debug
