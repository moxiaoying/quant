<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="Keywords" content="wild">
  <meta name="description" content="" />
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>trade</title>
  <link rel="stylesheet" type="text/css" href="/static/css/common.css">

  <script type="text/javascript" src="/static/js/lib/jquery/3.2.1/jquery.js"></script>
  <script type="text/javascript" src="/static/js/util/common.js"></script>
  <script type="text/javascript" src="/static/js/util/consts.js"></script>
  <script type="text/javascript" src="/static/js/util/frame.js"></script>
  <script type="text/javascript" src="/static/js/modules/system.js"></script>

  <script type="text/javascript">
    pageConfiguration.needAuth = true;
    function onload() {
      renderTradeMenu(0);
      initStockDataSync();
    }

    function initStockDataSync() {
      var panel = document.getElementById('stock-data-sync');
      var button = document.getElementById('stock-data-sync-btn');
      var status = document.getElementById('stock-data-sync-status');
      var startDate = document.getElementById('stock-data-start-date');

      function renderStatus(data) {
        if (data.running) {
          status.textContent = '同步进行中，请勿重复点击';
          button.disabled = true;
        } else {
          button.disabled = false;
          status.textContent = data.message || '空闲';
        }
      }

      function refreshStatus() {
        $.ajax({
          url: GlobalConfig.serverUrl + '/api/system/stockDataSyncStatus',
          type: 'GET',
          headers: getRequestHeaders(),
          success: renderStatus,
          error: function(xhr) {
            ExceptionHandler.handleCommonError(xhr);
          }
        });
      }

      button.addEventListener('click', function() {
        button.disabled = true;
        status.textContent = '正在启动同步...';
        $.ajax({
          url: GlobalConfig.serverUrl + '/api/system/stockDataSync',
          type: 'POST',
          data: {
            backfill: true,
            startDate: startDate.value,
            endDate: ''
          },
          headers: getRequestHeaders(),
          success: function(data) {
            status.textContent = data.message || '同步已启动';
            refreshStatus();
          },
          error: function(xhr) {
            button.disabled = false;
            ExceptionHandler.handleCommonError(xhr);
          }
        });
      });

      refreshStatus();
      window.setInterval(refreshStatus, 5000);
    }
  </script>

</head>

<body>
  <div id="head" class="head"></div>

  <div class="container">
    <div class="innerBox">
      <div class="backStage">
        <ul class="menu-nav">
        </ul>
      </div>
      <section id="stock-data-sync" class="stock-data-sync-panel">
        <h2>行情数据</h2>
        <div class="stock-data-sync-row">
          <label for="stock-data-start-date">起始日期</label>
          <input id="stock-data-start-date" type="date" value="2024-01-01">
          <button id="stock-data-sync-btn" type="button" class="btn">一键下载并补全</button>
          <span id="stock-data-sync-status">检查状态中...</span>
        </div>
      </section>
    </div>
  </div>

  <div id="foot" class="foot"></div>

</body>

</html>
